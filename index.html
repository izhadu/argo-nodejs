<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Core Edge Service - System Status</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 560px;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .title-group h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.025em;
    }
    .title-group p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .metric-box {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .metric-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .metric-value {
      font-size: 1.1rem;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--muted);
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-group">
        <h1>Cloud Edge Gateway</h1>
        <p>Distributed Telemetry &amp; Routing Node</p>
      </div>
      <div class="badge">
        <span class="dot"></span>
        Operational
      </div>
    </div>

    <div class="metrics">
      <div class="metric-box">
        <div class="metric-label">Runtime Engine</div>
        <div class="metric-value">Node.js v22 LTS</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">Edge Latency</div>
        <div class="metric-value" id="latency">14 ms</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">Protocol Stack</div>
        <div class="metric-value">HTTP/1.1 &amp; h2</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">Uptime SLA</div>
        <div class="metric-value">99.98%</div>
      </div>
    </div>

    <div class="footer">
      <span>Build: v1.4.2-release</span>
      <span id="timestamp">Syncing time...</span>
    </div>
  </div>

  <script>
    function updateStatus() {
      const now = new Date();
      document.getElementById('timestamp').textContent = now.toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
      const jitter = Math.floor(Math.random() * 6) + 12;
      document.getElementById('latency').textContent = jitter + ' ms';
    }
    updateStatus();
    setInterval(updateStatus, 3000);
  </script>
</body>
</html>
